<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta http-equiv="X-UA-Compatible"
        content="ie=edge">

  <title>MIL rincón del sabor - Pedidos</title>


  <!-- MATERIALIZE -->

  <link rel="stylesheet"
        href="../css/materialize.min.css">


  <!-- ICONOS -->

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet">


  <!-- ESTILOS -->

  <link rel="stylesheet"
        href="../css/styles.css">


  <!-- LEAFLET -->

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">


  <style>

    #mapa {
      height: 180px;
      width: 100%;
      margin-top: 20px;
    }

  </style>

</head>


<body class="grey lighten-4">


  <!-- BARRA SUPERIOR -->

  <nav class="z-depth-0">

    <div class="nav-wrapper container">

      <a href="../">
        MIL rincón del sabor
      </a>


      <span class="right grey-text text-darken-1">

        <i class="material-icons sidenav-trigger"
           data-target="side-menu">

          menu

        </i>

      </span>

    </div>

  </nav>


  <!-- MENÚ LATERAL -->

  <ul id="side-menu"
      class="sidenav side-menu">

    <li>

      <a class="subheader">
        MIL rincón del sabor
      </a>

    </li>


    <li>

      <a href="../"
         class="waves-effect">

        Inicio

      </a>

    </li>


    <li>

      <a href="./pedidos.html"
         class="waves-effect">

        Pedidos

      </a>

    </li>


    <li>

      <a href="./about.html"
         class="waves-effect">

        Acerca de

      </a>

    </li>


    <li>

      <div class="divider"></div>

    </li>


    <li>

      <a href="./contact.html"
         class="waves-effect">

        <i class="material-icons">
          mail_outline
        </i>

        Contacto

      </a>

    </li>

  </ul>


  <!-- FORMULARIO -->

  <div class="container grey-text">

    <form id="form-pedido">


      <!-- PLATILLO -->

      <div class="input-field">

        <select id="listaPlatillos">

        </select>

        <label>
          Platillos
        </label>

      </div>


      <!-- CLIENTE -->

      <div class="input-field">

        <input
          id="cliente"
          type="text"
          class="validate">

        <label for="cliente">
          Nombre del Cliente
        </label>

      </div>


      <!-- DIRECCIÓN -->

      <div class="input-field">

        <input
          id="direccion"
          type="text"
          class="validate">

        <label for="direccion">
          Dirección de entrega
        </label>

      </div>


      <!-- BOTONES -->

      <div class="input-field center">

        <button
          type="submit"
          class="btn-small green">

          Guardar

        </button>


        <a href="../"
           class="btn-small red">

          Cancelar

        </a>

      </div>


    </form>


    <!-- UBICACIÓN -->

    <div class="center">

      <button
        id="btnUbicacion"
        class="btn-small">

        Ubicación

      </button>

    </div>


    <!-- MAPA -->

    <div id="mapa"></div>

  </div>


  <!-- FIREBASE -->

  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>

  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"></script>


  <!-- MATERIALIZE -->

  <script src="../js/materialize.min.js"></script>


  <!-- FIREBASE DE TU PROYECTO -->

  <script src="../js/firebase.js"></script>


  <!-- PEDIDOS -->

  <script src="../js/pedidos.js"></script>


  <!-- LEAFLET -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin="">
  </script>

</body>

</html>
