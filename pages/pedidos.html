  <link rel="stylesheet" href="/css/materialize.min.css">

  <script src="/js/materialize.min.js"></script>
</head>

<body class="grey lighten-4">

  <!-- Barra superior -->
  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="/"><span>MIL rincón del sabor</span></a>

      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu">menu</i>

    </div>
  </nav>

  <!-- Menú lateral -->

  <!-- Formulario -->
  <div class="container grey-text">

    <form id="form-pedido">

      <div class="input-field">
        <select id="listaPlatillos"></select>

      <div class="input-field">
        <input id="cliente" type="text" class="validate">

      </div>

      <div class="input-field">
        <input id="direccion" type="text" class="validate">
        <label for="direccion">Dirección de entrega</label>
      </div>

      <div class="input-field center">
        <button type="submit" class="btn-small green">
          Guardar
        </button>

       <a href="/index.html" class="btn-small red">Cancelar</a>
      </div>

    </form>
    <button id="btnUbicacion">Ubicacion</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>
