<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, shrink-to-fit=no">

  <meta http-equiv="X-UA-Compatible"
        content="ie=edge">

  <title>MIL rincón del sabor</title>

  <!-- MATERIALIZE -->
  <link type="text/css"
        href="./css/materialize.min.css"
        rel="stylesheet">

  <!-- ICONOS -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet">

  <!-- ESTILOS -->
  <link type="text/css"
        href="./css/styles.css"
        rel="stylesheet">

  <!-- MANIFEST -->
  <link rel="manifest"
        href="./manifest.json">

  <!-- PWA -->
  <meta name="mobile-web-app-capable"
        content="yes">

  <meta name="apple-mobile-web-app-capable"
        content="yes">

  <meta name="application-name"
        content="MIL rincón del sabor">

  <meta name="apple-mobile-web-app-title"
        content="MIL rincón del sabor">

  <meta name="theme-color"
        content="#ca0707">

  <meta name="msapplication-navbutton-color"
        content="#ca0707">

  <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">

  <!-- ICONOS DE LA APP -->
  <link rel="icon"
        type="image/png"
        sizes="16x16"
        href="./img/icons/icon-16x16.png">

  <link rel="apple-touch-icon"
        href="./img/icons/icon-192x192.png">

  <link rel="icon"
        type="image/png"
        sizes="32x32"
        href="./img/icons/icon-32x32.png">

  <link rel="icon"
        type="image/png"
        sizes="48x48"
        href="./img/icons/icon-48x48.png">

  <link rel="icon"
        type="image/png"
        sizes="64x64"
        href="./img/icons/icon-64x64.png">

  <link rel="icon"
        type="image/png"
        sizes="96x96"
        href="./img/icons/icon-96x96.png">

  <link rel="icon"
        type="image/png"
        sizes="128x128"
        href="./img/icons/icon-128x128.png">

  <link rel="icon"
        type="image/png"
        sizes="192x192"
        href="./img/icons/icon-192x192.png">

  <link rel="icon"
        type="image/png"
        sizes="512x512"
        href="./img/icons/icon-512x512.png">

</head>


<body class="grey lighten-4">

  <!-- MENU SUPERIOR -->
  <nav class="z-depth-0">
    <div class="nav-wrapper container">

      <a href="./">
        MIL rincón del sabor
      </a>

      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger"
           data-target="side-menu">
          menu
        </i>
      </span>

    </div>
  </nav>


  <!-- MENU LATERAL -->
  <ul id="side-menu"
      class="sidenav side-menu">

    <li>
      <a class="subheader">
        MIL rincón del sabor
      </a>
    </li>

    <li>
      <a href="./"
         class="waves-effect">
        Inicio
      </a>
    </li>

    <li>
      <a href="./pages/pedidos.html"
         class="waves-effect">
        Pedidos
      </a>
    </li>

    <li>
      <a href="./pages/about.html"
         class="waves-effect">
        Acerca
      </a>
    </li>

    <li>
      <div class="divider"></div>
    </li>

    <li>
      <a href="./pages/contact.html"
         class="waves-effect">

        <i class="material-icons">
          mail_outline
        </i>

        Contacto

      </a>
    </li>

  </ul>


  <!-- LISTA DE PLATILLOS -->
  <div class="recipes container grey-text text-darken-1">

  </div>


  <!-- BOTON AGREGAR -->
  <div class="center">

    <a class="btn-floating btn-small btn-large add-btn sidenav-trigger"
       data-target="side-form">

      <i class="material-icons">
        add
      </i>

    </a>

  </div>


  <!-- AGREGAR PLATILLO -->
  <div id="side-form"
       class="sidenav side-form">

    <form class="add-recipe container section">

      <h6>
        Nuevo platillo
      </h6>

      <div class="divider"></div>


      <!-- NOMBRE -->
      <div class="input-field">

        <input
          placeholder="Ejemplo: Pizza"
          id="title"
          type="text"
          class="validate">

        <label for="title">
          Nombre
        </label>

      </div>


      <!-- INGREDIENTES -->
      <div class="input-field">

        <input
          placeholder="Ejemplo: Queso, champiñones, ajo"
          id="ingredients"
          type="text"
          class="validate">

        <label for="ingredients">
          Ingredientes
        </label>

      </div>


      <!-- PRECIO -->
      <div class="input-field">

        <input
          placeholder="Su precio es:"
          id="price"
          type="text"
          class="validate">

        <label for="price">
          Precio
        </label>

      </div>


      <!-- BOTON -->
      <div class="input-field center">

        <button class="btn-small">
          Agregar
        </button>

      </div>

    </form>


    <!-- BOTONES DE CAMARA -->
    <button id="btnFoto">
      Imagen
    </button>

    <button id="tomarFoto">
      Capturar
    </button>


    <!-- CAMARA -->
    <div id="camara">

      <video id="video"
             autoplay>
        No hay video disponible
      </video>

    </div>


    <canvas id="canvas"></canvas>


    <!-- FOTO RESULTANTE -->
    <div id="salida">

      <img id="foto"
           src=""
           alt="Foto del platillo">

    </div>

  </div>


  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>

  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"></script>


  <!-- MATERIALIZE -->
  <script src="./js/materialize.min.js"></script>


  <!-- JAVASCRIPT -->
  <script src="./js/firebase.js"></script>

  <script src="./js/index.js"></script>

  <script src="./js/db.js"></script>


  <!-- SERVICE WORKER -->
  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", function () {

        navigator.serviceWorker
          .register("./sw.js")

          .then(function (registro) {

            console.log(
              "Service Worker registrado:",
              registro.scope
            );

          })

          .catch(function (error) {

            console.error(
              "Error al registrar Service Worker:",
              error
            );

          });

      });

    }

  </script>

</body>

</html>
